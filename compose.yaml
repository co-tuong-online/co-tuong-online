services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cotuong
      POSTGRES_USER: cotuong
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or local .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cotuong-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotuong -d cotuong"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cotuong-data:
