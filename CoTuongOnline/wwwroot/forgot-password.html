<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <title>Quên mật khẩu · Cờ Tướng Online</title>
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-art">
      <div class="big-glyph" aria-hidden="true">帥</div>
      <blockquote><b>Một nước sai, cả ván thua.</b> Đăng nhập để vào phòng cùng bạn bè, gọi video trong lúc đánh, hoặc luyện với máy.</blockquote>
    </aside>
    <main class="auth-main">
      <div class="auth-card">
        <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">帥</span><span class="brand-name">Cờ Tướng Online</span></a>

        <section id="stepEmail">
          <h1>Quên mật khẩu</h1>
          <p class="muted">Nhập email của tài khoản, chúng tôi sẽ gửi mã để đặt mật khẩu mới.</p>
          <form id="emailForm" class="stack" novalidate>
            <div id="formMsg" class="hidden"></div>
            <label class="field"><span>Email</span>
              <input class="input" name="email" type="email" autocomplete="email" required autofocus></label>
            <button class="btn primary big block" type="submit">Gửi mã</button>
          </form>
        </section>

        <section id="stepReset" class="hidden">
          <h1>Đặt mật khẩu mới</h1>
          <p class="muted">Nhập mã 6 số đã gửi tới <b id="otpEmail"></b>.</p>
          <form id="resetForm" class="stack" novalidate>
            <div id="resetMsg" class="hidden"></div>
            <div id="otpBoxes"></div>
            <label class="field"><span>Mật khẩu mới</span>
              <div class="pw-wrap">
                <input class="input" name="password" type="password" autocomplete="new-password" required>
                <button type="button" class="btn ghost small pw-toggle" data-toggle-pw>Hiện</button>
              </div>
              <div class="hint">Ít nhất 8 ký tự, có cả chữ và số.</div></label>
            <label class="field"><span>Nhập lại mật khẩu mới</span>
              <input class="input" name="confirm" type="password" autocomplete="new-password" required></label>
            <button class="btn primary big block" type="submit">Đổi mật khẩu</button>
            <div class="row"><button type="button" class="btn ghost small" id="resendBtn">Gửi lại mã</button></div>
          </form>
        </section>

        <p class="switch"><a href="/login.html">Quay lại đăng nhập</a></p>
      </div>
    </main>
  </div>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/auth-pages.js"></script>
  <script>AuthPages.forgot();</script>
</body>
</html>
